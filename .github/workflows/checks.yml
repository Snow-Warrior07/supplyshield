name: Project verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m pytest -q --junitxml=test-results/unit.xml
      - run: python scripts/evaluate.py
      - run: node scripts/browser_engine_tests.mjs
      - name: Real HTTP integration
        run: |
          python -m uvicorn api:app --host 127.0.0.1 --port 8765 > /tmp/supplyshield-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python -c 'import time,urllib.request; time.sleep(2); urllib.request.urlopen("http://127.0.0.1:8765/health")'
          python scripts/live_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: test-results/
